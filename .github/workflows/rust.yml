name: Build and Release

on:
  push:
    branches: ["project"]
    tags:
      - 'v*'
  pull_request:
    branches: ["project"]

permissions:
  contents: write

jobs:
  build:
    name: Build Asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${crate}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version ${crate}"
            exit 1
          fi

      - name: Build cmdflow
        run: cargo build --release --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Check cmdflow runs
        run: ./target/release/cmdflow --version

      - name: Prepare asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp ./target/release/cmdflow ./cmdflow-linux-x86_64

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          f=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "title=$(head -n1 "$f" | sed 's/^# *//')" >> "$GITHUB_OUTPUT"
            tail -n +2 "$f" > release-body.md
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "title=cmdflow ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            : > release-body.md
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-body.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          files: cmdflow-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur:
    name: Update AUR package
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set pkgver from tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          grep -E '^pkg(ver|rel)=' aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: cmdflow
          pkgbuild: aur/PKGBUILD
          assets: aur/cmdflow.install
          updpkgsums: true
          commit_username: voide
          commit_email: voideez@users.noreply.github.com
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
